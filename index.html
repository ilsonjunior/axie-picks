<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axie Pick and Bansss</title>
    <link rel="icon" href="SPG-FROG.png" type="image/x-icon">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: auto;
            padding: 0;
            background: linear-gradient(135deg, #4e2a84, #32d748); /* Degradê entre roxo e verde */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        #mainContainer {
            max-width: 1200px; /* Limita a largura máxima do container */
            margin-top: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .section {
            padding: 5px;
            background-color: rgba(36, 28, 61, 0.8); /* Fundo com opacidade */
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 95%;
            max-width: 80%;
            box-sizing: content-box;
            align-items: center;
        }

        .image-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            background-color: rgba(72, 43, 135, 0.6);
            border-radius: 10px;
            box-sizing: border-box;
            align-items: center;
        }

        .image-container {
            position: relative;
            width: calc(100% / 7 - 10px);
            margin-bottom: 10px;
            overflow: hidden;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .image-box img {
            width: 95%;
            height: 95%;
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
        }

        .image-box img.clicked {
            background-color: red;
            transform: scale(1.1);
            border-color: #ff4081;
        }
        
        .image-box img.green {
            background-color: rgb(146, 223, 107);
            transform: scale(1.1);
            border-color: greenyellow;
        }

        .delete-button {
            position: absolute;
            top: 2px;
            right: 2px;
            background-color: #ff4081;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 50%;
            transition: background-color 0.3s;
        }

        .delete-button:hover {
            background-color: #f50057;
        }

        button {
            background-color: #3db52d;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }

        button:hover {
            background-color: #28a745;
        }

        button:active {
            background-color: #1c7a3a;
        }

        h2[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: gray;
        }

        h2[contenteditable="true"] {
            outline: none;
            border: none;
            font-size: 20px;
            color: #ffeb3b;
        }

        input[type="text"] {
            padding: 8px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #fff;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            width: 200px;
            text-align: center;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #ffeb3b;
        }

    </style>

</head>
<body>
    
    <div id="mainContainer"></div>
    
    <button onclick="adicionarNovaSecao()">ADD</button>

    <script type="module"> 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push as firebasePush, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

            databaseURL: "https://axie-picks-default-rtdb.firebaseio.com",
            projectId: "axie-picks",
            storageBucket: "axie-picks.firebasestorage.app",
            messagingSenderId: "658160083269",
            appId: "1:658160083269:web:6e64583b9996fa6b221e2c"
        };

        window.app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);

        onValue(sectionsRef, (snapshot) => {
            const data = snapshot.val();
            document.getElementById("mainContainer").innerHTML = "";
            window.sectionCount = 0;
            for (let key in data) {
                window.sectionCount++;
                adicionarNovaSecao(data[key].title, data[key].images, window.sectionCount, key);
            }

        window.salvarSecoes = function() {
            const sections = {};
            const allSections = document.querySelectorAll('.section');
            
            allSections.forEach((section) => {
                const key = section.dataset.key || firebasePush(ref(db, "sections")).key; // Gera chave única

                    }))
                };
                section.dataset.key = key; // Armazena a chave para futuras atualizações
            });

            Object.keys(sections).forEach(key => {

            });
        }

        window.apagarSecao = function(sectionNumber) {
        const secao = document.getElementById('section' + sectionNumber);

            // Remove a seção do Firebase

    <script>

       let sectionCount = 0;

        function adicionarNovaSecao(title = 'Guild', images = [], sectionNumber, key = null) {
            const container = document.getElementById('mainContainer');
            const novaSecao = document.createElement('div');
            novaSecao.classList.add('section');
            novaSecao.id = 'section' + sectionCount;
            if (key) novaSecao.dataset.key = key;

            novaSecao.innerHTML = `
                <h2 id="meuTitulo${sectionCount}" contenteditable="true">${title}</h2>
                <input type="text" id="imageIds${sectionCount}" placeholder="list of ids separated by commas">
                <button onclick="mostrarImagens(${sectionCount})">Show</button>
                <button onclick="apagarTodasImagens(${sectionCount})">Delete All</button>
                <div class="image-box" id="imageContainer${sectionCount}"></div>
                <div id="imageIdsDisplay${sectionCount}" style="margin-top: 10px; color: white;"></div>
                <button onclick="moverParaCima(${sectionCount})">&lt;</button>
                <button onclick="moverParaBaixo(${sectionCount})">&gt;</button>
                <button onclick="minimizarSecao(${sectionCount})">_</button>
                <button onclick="apagarSecao(${sectionCount})">X</button>
            `;

            container.appendChild(novaSecao);

            // Adiciona o evento de escuta para o título
            const titulo = document.getElementById(`meuTitulo${sectionCount}`);
            titulo.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault(); // Evita a quebra de linha
                    const novoTitulo = titulo.innerText.trim(); // Obtém o novo título
                    titulo.innerText = novoTitulo; // Atualiza o título
                    salvarSecoes(); // Salva as seções quando "Enter" é pressionado
                }
            });

            const imageContainer = document.getElementById('imageContainer' + sectionCount);
            images.forEach((image) => {
                const imageWrapper = document.createElement('div');
                imageWrapper.classList.add('image-container');
                
                const img = document.createElement('img');
                img.src = image.src;
                if (image.clicked) img.classList.add('clicked'); // Restaura o estado de "clicked"
                if (image.green) img.classList.add('green'); // Restaura o estado de "green"
                img.onclick = function() {
                    this.classList.toggle('clicked');
                    salvarSecoes(); // Salva o estado da imagem
                };
                img.oncontextmenu = function(event) {
                    event.preventDefault(); // Evita o menu de contexto padrão
                    this.classList.toggle('green');
                    salvarSecoes(); // Salva o estado da imagem
                };
                
                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'X';
                deleteButton.classList.add('delete-button');
                deleteButton.onclick = function() {
                    imageContainer.removeChild(imageWrapper);
                    salvarSecoes();
                    atualizarIdsDisplay(sectionNumber);
                };
                
                imageWrapper.appendChild(img);
                imageWrapper.appendChild(deleteButton);
                imageContainer.appendChild(imageWrapper);
            });

            atualizarIdsDisplay(sectionCount);

            sectionCount++; // Incrementa o contador de seções
            salvarSecoes();
        }

        function mostrarImagens(sectionNumber) {
            const inputField = document.getElementById('imageIds' + sectionNumber);
            const ids = inputField.value.split(',');
            const container = document.getElementById('imageContainer' + sectionNumber);
            
            ids.forEach(id => {
                const trimmedId = id.trim();
                if (!trimmedId) return;
                
                const imgUrl = `https://axiecdn.axieinfinity.com/axies/${trimmedId}/axie/axie-full-transparent.png`;
                
                const imageWrapper = document.createElement('div');
                imageWrapper.classList.add('image-container');
                
                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = `Imagem ${trimmedId}`;
                img.onclick = function() {
                    this.classList.toggle('clicked');
                };
                
                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'X';
                deleteButton.classList.add('delete-button');
                deleteButton.onclick = function() {
                    container.removeChild(imageWrapper);
                    atualizarIdsDisplay(sectionNumber);
                };
                
                imageWrapper.appendChild(img);
                imageWrapper.appendChild(deleteButton);
                container.appendChild(imageWrapper);
            });

            inputField.value = '';
            atualizarIdsDisplay(sectionNumber);atualizarIdsDisplay(sectionNumber);
            salvarSecoes();
        }

        function apagarTodasImagens(sectionNumber) {
            document.getElementById('imageContainer' + sectionNumber).innerHTML = '';
            atualizarIdsDisplay(sectionNumber);
            salvarSecoes();
        }

        function atualizarIdsDisplay(sectionNumber) {
            const container = document.getElementById('imageContainer' + sectionNumber);
            const images = container.querySelectorAll('img');
            const ids = Array.from(images).map(img => {
                const src = img.src;
                const idMatch = src.match(/axies\/(\d+)\/axie/);
                return idMatch ? idMatch[1] : null;
            }).filter(id => id !== null);

            const idsDisplay = document.getElementById('imageIdsDisplay' + sectionNumber);
            idsDisplay.innerText = `IDs: ${ids.join(', ')}`;
        }

        function moverParaCima(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const prevSecao = secao.previousElementSibling;
            
            if (prevSecao) {
                secao.parentNode.insertBefore(secao, prevSecao);
                salvarSecoes();
            }
        }

        function moverParaBaixo(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const nextSecao = secao.nextElementSibling;
            
            if (nextSecao) {
                secao.parentNode.insertBefore(nextSecao, secao);
                salvarSecoes();
            }
        }

        function minimizarSecao(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const imageBox = secao.querySelector('.image-box');
            
            if (imageBox.style.display === 'none') {
                imageBox.style.display = 'flex';
            } else {
                imageBox.style.display = 'none';
            }
            salvarSecoes();
        }

    </script>
</body>
</html>
