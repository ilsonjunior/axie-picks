<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axie Pick and Bansss</title>
    <link rel="icon" href="SPG-FROG.png" type="image/x-icon">
    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: auto;
            padding: 0;
            background: linear-gradient(135deg, #4e2a84, #32d748); /* Degradê entre roxo e verde */
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            flex-direction: column;
            width: 100%;
        }

        #mainContainer {
            display: flex;
            flex-wrap: wrap; /* Permite que as seções quebrem de linha quando necessário */
            justify-content: center;
            gap: 10px;
            max-width: none;
            width: 90%;
            margin-top: 5px;
        }

        .section {
            width: 48%;
            max-width: none;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(36, 28, 61, 0.8); /* Fundo com opacidade */
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .section {
                width: 100%; /* Seções ocupam 100% da largura em telas pequenas */
            }

            .button-group {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }


        .image-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            width: 100%;
            background-color: rgba(72, 43, 135, 0.6);
            border-radius: 10px;
            box-sizing: border-box;
            align-items: center;
        }

        .image-container {
            position: relative;
            width: calc(100% / 5 - 10px);
            margin-bottom: 10px;
            overflow: hidden;
            border-radius: 10px;
            box-sizing: border-box;
        }

        .image-box img {
            width: 90%;
            height: 90%;
            border-radius: 5px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
        }

        .image-box img.clicked {
            background-color: red;
            transform: scale(1.1);
            border-color: #ff4081;
        }
        
        .image-box img.green {
            background-color: rgb(146, 223, 107);
            transform: scale(1.1);
            border-color: greenyellow;
        }

        .delete-button {
            position: absolute;
            top: 3px;
            right: 6px;
            background-color: #3b2d2d;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 4px;
            border-radius: 50%;
            transition: background-color 0.3s;
            border-color: black;
            border-radius: 5px;
        }

        .delete-button:hover {
            background-color: #f50057;
        }

        button {
            background-color: #3db52d;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin: 5px;
        }

        button:hover {
            background-color: #28a745;
        }

        button:active {
            background-color: #1c7a3a;
        }

        h2[contenteditable="true"]:empty:before {
            content: attr(placeholder);
            color: gray;
        }

        h2[contenteditable="true"] {
            outline: none;
            border: none;
            font-size: 20px;
            color: #ffeb3b;
        }

        input[type="text"] {
            padding: 8px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #fff;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            width: 200px;
            text-align: center;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            border-color: #ffeb3b;
        }

        h2:focus {
            outline: none;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap; /* Permite que os botões se ajustem caso o espaço seja pequeno */
            justify-content: center; /* Centraliza os botões */
            gap: 10px; /* Espaço entre os botões */
            width: 100%;
            margin-top: 10px;
        }

        .section input[type="text"] {
            width: 90%; /* Faz o input ocupar quase toda a largura da seção */
            max-width: 600px; /* Limita para não ficar muito grande em telas grandes */
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #fff;
            background-color: rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            box-sizing: border-box;
            font-size: 16px;
        }

    </style>

</head>
<body>
    
    <div id="mainContainer"></div>
    
    <button onclick="adicionarNovaSecao()">ADD</button>

    <script type="module"> 
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set, push as firebasePush, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAbQhL5c8OiV4mnyxtKCxJNlUeeVUXnl6E",
            authDomain: "axie-picks.firebaseapp.com",
            databaseURL: "https://axie-picks-default-rtdb.firebaseio.com",
            projectId: "axie-picks",
            storageBucket: "axie-picks.firebasestorage.app",
            messagingSenderId: "658160083269",
            appId: "1:658160083269:web:6e64583b9996fa6b221e2c"
        };

        window.app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.sectionsRef = ref(db, "sections");

        window.isUpdatingFromFirebase = false; // Flag para evitar loop infinito
        window.firebaseSet = set;
        window.firebaseRef = ref;

        onValue(sectionsRef, (snapshot) => {
            if (window.isUpdatingFromFirebase) return; // 🔥 Evita atualização indesejada

            window.isUpdatingFromFirebase = true;
            const data = snapshot.val();
            const mainContainer = document.getElementById("mainContainer");

            // 🔥 Salva a posição da rolagem antes de atualizar o DOM
            const scrollY = window.scrollY;

            // Remove todas as seções antes de recriar na ordem correta
            while (mainContainer.firstChild) {
                mainContainer.removeChild(mainContainer.firstChild);
            }

            window.sectionCount = 0;

            if (data) {
                // Converte os objetos em um array e ordena pelo campo "order"
                const orderedSections = Object.entries(data)
                    .map(([key, value]) => ({ key, ...value }))
                    .sort((a, b) => a.order - b.order);

                orderedSections.forEach((sectionData) => {
                    window.sectionCount++;
                    adicionarNovaSecao(sectionData.title, sectionData.images, window.sectionCount, sectionData.key);
                });
            }

            setTimeout(() => {
                window.isUpdatingFromFirebase = false; // 🔥 Evita bloqueio permanente
            }, 300);

            window.scrollTo(0, scrollY); // 🔥 Restaura a posição da rolagem após a atualização
        });


        window.salvarSecoes = function() {
            if (isUpdatingFromFirebase) return; // Se estamos atualizando do Firebase, não salva

            const sections = {};
            document.querySelectorAll('.section').forEach((section, index) => {
                const key = section.dataset.key || firebasePush(ref(db, "sections")).key; // Gera chave única
                
                sections[key] = {
                    title: section.querySelector('h2').innerText,
                    order: index, // Salva a posição da seção
                    images: Array.from(section.querySelectorAll('.image-box img')).map(img => ({
                        src: img.src,
                        clicked: img.classList.contains('clicked'),
                        green: img.classList.contains('green')
                    }))
                };

                section.dataset.key = key; // Atualiza o atributo "data-key"
            });

            set(ref(db, "sections"), sections)
                .then(() => console.log("Seções salvas com sucesso!"))
                .catch(error => console.error("Erro ao salvar seções:", error));
        };

        window.apagarSecao = function(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            if (!secao) return; // Se a seção não existe, sai da função

            const key = secao.dataset.key; // Obtém a chave da seção no Firebase

            if (key) {
                // Remove a seção do Firebase
                const secaoRef = ref(db, `sections/${key}`);
                remove(secaoRef).then(() => {
                    console.log("Seção removida do Firebase com sucesso!");
                }).catch((error) => {
                    console.error("Erro ao remover a seção do Firebase:", error);
                });
            }

            secao.remove(); // Remove a seção do DOM
            salvarSecoes();
        };


    </script>

    <script>

       let sectionCount = 0;

        function adicionarNovaSecao(title = 'Guild', images = [], sectionNumber, key = null) {
            const container = document.getElementById('mainContainer');
            const novaSecao = document.createElement('div');
            novaSecao.classList.add('section');
            novaSecao.id = 'section' + sectionCount;
            if (key) novaSecao.dataset.key = key;

            novaSecao.innerHTML = `
                <h2 id="meuTitulo${sectionCount}" contenteditable="true">${title}</h2>
                <input type="text" id="imageIds${sectionCount}" placeholder="List of IDs separated by commas"
                    onkeydown="if(event.key === 'Enter') { event.preventDefault(); mostrarImagens(${sectionCount}); }">
                <div class="image-box" id="imageContainer${sectionCount}"></div>
                <div id="imageIdsDisplay${sectionCount}" style="margin-top: 10px; color: white;"></div>
                <div class="button-group">
                    <button onclick="moverParaCima(${sectionCount})">⬆</button>
                    <button onclick="moverParaBaixo(${sectionCount})">⬇</button>
                    <button onclick="apagarTodasImagens(${sectionCount})">Delete All</button>
                    <button onclick="apagarSecao(${sectionCount})">❌</button>
                </div>
            `;

            container.appendChild(novaSecao);

            // Adiciona evento para salvar o título ao pressionar Enter
            const titulo = document.getElementById(`meuTitulo${sectionCount}`);
            titulo.addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    event.preventDefault();
                    titulo.innerText = titulo.innerText.trim();
                    salvarSecoes();
                }
            });

            const imageContainer = document.getElementById('imageContainer' + sectionCount);
            images.forEach((image) => {
                const imageWrapper = document.createElement('div');
                imageWrapper.classList.add('image-container');
                
                const img = document.createElement('img');
                img.src = image.src;
                if (image.clicked) img.classList.add('clicked'); // Restaura o estado de "clicked"
                if (image.green) img.classList.add('green'); // Restaura o estado de "green"
                img.onclick = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    // Remover a classe 'green' antes de adicionar 'clicked'
                    this.classList.remove('green');
                    
                    this.classList.toggle('clicked');
                    salvarSecoes();
                };
                img.oncontextmenu = function(event) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    // Remover a classe 'clicked' antes de adicionar 'green'
                    this.classList.remove('clicked');
                    
                    this.classList.toggle('green');
                    salvarSecoes();
                };
                
                const deleteButton = document.createElement('button');
                deleteButton.innerText = 'X';
                deleteButton.classList.add('delete-button');
                deleteButton.onclick = function() {
                    imageContainer.removeChild(imageWrapper);
                    salvarSecoes();
                    atualizarIdsDisplay(sectionNumber);
                };
                
                imageWrapper.appendChild(img);
                imageWrapper.appendChild(deleteButton);
                imageContainer.appendChild(imageWrapper);
            });

            atualizarIdsDisplay(sectionCount);

            sectionCount++; // Incrementa o contador de seções
            salvarSecoes();
        }

        async function fetchAxiesFromWallet(sectionNumber) {
            const formattedAddress = sectionNumber;
            const url = `https://deep-index.moralis.io/api/v2/${formattedAddress}/nft?chain=ronin`;
            const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjA0MjQyMDBlLWM1ZGItNDk0Ny1hNmQyLTYxNWE4M2QwOTc2YiIsIm9yZ0lkIjoiNDMwNjA2IiwidXNlcklkIjoiNDQyOTQ0IiwidHlwZUlkIjoiMmIwOGI2MjEtZWQ5ZS00ZGM3LThjMzgtNDhjZDYyNjY0OGQxIiwidHlwZSI6IlBST0pFQ1QiLCJpYXQiOjE3MzkyMTc4NzMsImV4cCI6NDg5NDk3Nzg3M30.dRIW1gOgbPpjkajRNQeaooVQ4dLw4GZH0hTIjat7pMU";

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'X-API-Key': API_KEY,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro: ${response.status} - ${response.statusText}`);
                }

                const data = await response.json();
                const axies = data.result.filter(nft => nft.token_address === '0x32950db2a7164ae833121501c797d79e7b79d74c').map(nft => String(nft.token_id));
                console.log('buscou os axies ' + axies);

                return axies
            } catch (error) {
                alert("Erro ao buscar Axies.");
            }
        }

        function criarImagem(src, containerId) {
            const imageWrapper = document.createElement('div');
            imageWrapper.classList.add('image-container');
            const img = document.createElement('img');
            img.src = src;

            img.onclick = function(event) {
                event.preventDefault();
                event.stopPropagation();
                img.classList.toggle('clicked');
                img.classList.remove('green');
                salvarSecoes();
            };

            img.oncontextmenu = function(event) {
                event.preventDefault();
                event.stopPropagation();
                img.classList.toggle('green');
                img.classList.remove('clicked');
                salvarSecoes();
            };

            const deleteButton = document.createElement('button');
            deleteButton.innerText = 'X';
            deleteButton.classList.add('delete-button');
            deleteButton.onclick = function() {
                const container = document.getElementById(containerId);
                if (container) {
                    container.removeChild(imageWrapper);
                    atualizarIdsDisplay(sectionNumber);
                    salvarSecoes();
                }
            };

            imageWrapper.appendChild(img);
            imageWrapper.appendChild(deleteButton);
            return imageWrapper;
        }

        async function mostrarImagens(sectionNumber) {
            const inputField = document.getElementById(`imageIds${sectionNumber}`).value.trim();
            let axieIds = [];

            if (inputField.includes('x')) {
                axieIds = await fetchAxiesFromWallet(inputField);
                console.log('ronin');
                console.log(axieIds);
            }else {
                console.log(inputField.value)
                axieIds = inputField.split(/[\s,]+/).filter(id => id !== '');
                console.log('ids');
            }

            console.log('inputfield ' + inputField);
            
            const container = document.getElementById('imageContainer' + sectionNumber);

            // Obter os IDs já existentes
            const existingIds = new Set(
                Array.from(container.querySelectorAll('img')).map(img => {
                    const src = img.src;
                    const match = src.match(/axies\/(\d+)\/axie/);
                    return match ? match[1] : null;
                }).filter(id => id !== null)
            );

            axieIds.forEach(id => {
                if (!existingIds.has(id)) { // Adiciona apenas se não existir
                    const imgUrl = `https://axiecdn.axieinfinity.com/axies/${id}/axie/axie-full-transparent.png`;
                    container.appendChild(criarImagem(imgUrl, 'imageContainer' + sectionNumber));
                    existingIds.add(id); // Adiciona o ID ao conjunto
                } else {
                    console.warn(`Imagem com ID ${id} já existe e não será adicionada.`);
                }
            });

            inputField.value = ''; // Limpa o campo de entrada após processar os IDs
            atualizarIdsDisplay(sectionNumber);
            salvarSecoes();
        }


        function apagarTodasImagens(sectionNumber) {
            document.getElementById('imageContainer' + sectionNumber).innerHTML = '';
            atualizarIdsDisplay(sectionNumber);
            salvarSecoes();
        }

        function atualizarIdsDisplay(sectionNumber) {
            const container = document.getElementById('imageContainer' + sectionNumber);
            if (!container) return; // Se a seção foi removida, sai da função

            const images = container.querySelectorAll('img');
            const ids = Array.from(images).map(img => {
                const src = img.src;
                const idMatch = src.match(/axies\/(\d+)\/axie/);
                return idMatch ? idMatch[1] : null;
            }).filter(id => id !== null);

            const idsDisplay = document.getElementById('imageIdsDisplay' + sectionNumber);
            if (idsDisplay) { // Garante que o elemento ainda existe antes de acessar `innerText`
                idsDisplay.innerText = `IDs: ${ids.join(', ')}`;
            }
        }

        function atualizarOrdemNoFirebase() {
            if (window.isUpdatingFromFirebase) return; // Evita loop infinito

            const sections = {};
            let index = 0;

            document.querySelectorAll('.section').forEach(section => {
                const key = section.dataset.key;
                if (key) {
                    sections[key] = {
                        title: section.querySelector('h2').innerText,
                        order: index++, // 🔥 Atualiza a posição correta no Firebase
                        images: Array.from(section.querySelectorAll('.image-box img')).map(img => ({
                            src: img.src,
                            clicked: img.classList.contains('clicked'),
                            green: img.classList.contains('green')
                        }))
                    };
                }
            });

            // 🔥 Bloqueia atualizações enquanto salvamos no Firebase
            window.isUpdatingFromFirebase = true;

            window.firebaseSet(window.firebaseRef(window.db, "sections"), sections)
                .then(() => {
                    console.log("✅ Nova ordem salva no Firebase!");

                    // 🔥 Aguarda 300ms antes de permitir novas atualizações
                    setTimeout(() => {
                        window.isUpdatingFromFirebase = false;
                    }, 300);
                })
                .catch(error => {
                    console.error("❌ Erro ao salvar ordem das seções:", error);
                    window.isUpdatingFromFirebase = false;
                });
        }



        function moverParaCima(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const prevSecao = secao.previousElementSibling;

            if (!prevSecao) return; // Se já está no topo, não faz nada

            // Move a seção para cima no DOM
            secao.parentNode.insertBefore(secao, prevSecao);

            // 🔥 Salva imediatamente no Firebase
            atualizarOrdemNoFirebase();
        }

        function moverParaBaixo(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const nextSecao = secao.nextElementSibling;

            if (!nextSecao) return; // Se já está na última posição, não faz nada

            // 🔥 Verifica se há um próximo irmão antes de mover
            if (nextSecao.nextSibling) {
                secao.parentNode.insertBefore(nextSecao.nextSibling, secao);
            } else {
                // 🔥 Se for o último, move para o final da lista
                secao.parentNode.appendChild(secao);
            }

            // 🔥 Salva imediatamente no Firebase
            atualizarOrdemNoFirebase();
        }







        function minimizarSecao(sectionNumber) {
            const secao = document.getElementById('section' + sectionNumber);
            const imageBox = secao.querySelector('.image-box');
            
            if (imageBox.style.display === 'none') {
                imageBox.style.display = 'flex';
            } else {
                imageBox.style.display = 'none';
            }
            salvarSecoes();
        }

    </script>
</body>
